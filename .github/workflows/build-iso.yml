name: Build Verity OS ISO

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm archiso git github-cli

      - uses: actions/checkout@v4

      - name: Build ISO
        run: |
          chmod +x build.sh
          # On a tag build (v1.2.3) the tag is the single source of truth for the version
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "Building Verity OS ${VERSION:-<from VERSION file>}"
          ./build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: verityos-iso
          path: |
            out/*.iso
            out/SHA256SUMS
          retention-days: 30
          compression-level: 0

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          # Idempotent: re-running the workflow updates the existing release
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" out/*.iso out/SHA256SUMS --repo "$REPO" --clobber
          else
            gh release create "$TAG" out/*.iso out/SHA256SUMS --repo "$REPO" \
              --title "Verity OS $TAG" --generate-notes
          fi
