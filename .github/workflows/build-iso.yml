name: Build Verity OS ISO

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm archiso git github-cli

      - uses: actions/checkout@v4

      - name: Build ISO
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: verityos-iso
          path: |
            out/*.iso
            out/SHA256SUMS
          retention-days: 30
          compression-level: 0

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" out/*.iso out/SHA256SUMS --repo "${{ github.repository }}" --title "Verity OS ${{ github.ref_name }}" --generate-notes
